# A wine produced by a winery catalogued in another graph: the target is a
# CURIE against a prefix this schema declares, not a record in this file.
wines:
  - id: chateauMorgon
    name: Château Morgon
    color: red
    produced_by: wine:morgonEstateGlobal
wineries:
  - id: morgonEstate
    name: Morgon Estate
    region: Beaujolais
