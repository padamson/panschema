# Wine's identity shape: one `id` slot shared across record classes,
# with `slot_usage` splitting reference entities (global) from records that
# belong to their dataset (scoped per container). The shared slot carries
# neither flag: `slot_usage` refines rather than replaces, so a class
# narrowing a shared `identifier` to a `key` would carry both, which
# LinkML's loader and panschema refuse.

name: shared_id_scoping
id: https://example.org/scope-test
prefixes:
  linkml: https://w3id.org/linkml/
  st: https://example.org/scope-test/
default_prefix: st
default_range: string

slots:
  id:
    range: string
  name:
    range: string

classes:
  Catalog:
    tree_root: true
    slots: [id, name]
    slot_usage:
      id:
        identifier: true
    attributes:
      grapes:
        range: Grape
        multivalued: true
        inlined_as_list: true
      assessments:
        range: VintageAssessment
        multivalued: true
        inlined_as_list: true

  Grape:
    slots: [id, name]
    slot_usage:
      id:
        identifier: true

  VintageAssessment:
    slots: [id, name]
    slot_usage:
      id:
        key: true
