{%- if has_instances %}
        <li class="sidebar-group">
            <span class="sidebar-group-title">Instances</span>
            <ul class="sidebar-nav">
                <li><a href="#instance-metadata" class="sidebar-link{% if active_section == "instance-metadata" %} active{% endif %}">Metadata</a></li>
                <li><a href="#instance-graph" class="sidebar-link{% if active_section == "instance-graph" %} active{% endif %}">Graph <span class="badge" id="instance-graph-sidebar-count" title="{{ instance_node_count }} node{% if instance_node_count != 1 %}s{% endif %}, {{ instance_edge_count }} edge{% if instance_edge_count != 1 %}s{% endif %}" aria-label="{{ instance_node_count }} node{% if instance_node_count != 1 %}s{% endif %}, {{ instance_edge_count }} edge{% if instance_edge_count != 1 %}s{% endif %}">{{ instance_node_count }} / {{ instance_edge_count }}</span></a></li>
                <li><a href="#instance-individuals" class="sidebar-link{% if active_section == "instance-individuals" %} active{% endif %}">Individuals <span class="badge" id="instance-individuals-sidebar-count">{{ instance_individual_count }}</span></a></li>
            </ul>
        </li>
{%- endif %}
