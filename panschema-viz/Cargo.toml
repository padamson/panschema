[package]
name = "panschema-viz"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Interactive canvas visualization for panschema schema graphs"
license.workspace = true
repository.workspace = true
# Embedded into panschema at build time; never published on its own.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
# WASM-specific
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Navigator",
    "HtmlCanvasElement", "CanvasRenderingContext2d",
    "TextMetrics",
    "console",
] }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The graph type the layouts run on. The layout numerics themselves are
# vendored in src/layout/algo/ (see THIRD-PARTY.md).
petgraph = "0.8"
# Empty no-op crate providing `#[mutants::skip]` so we can mark
# provably/empirically-equivalent expressions without resorting to
# brittle line-number based excludes in scripts/mutants.sh.
mutants = "0.0.4"
# Sugiyama for layered/hierarchical layout. Now on petgraph 0.8 too
# (post-fork), so we no longer carry both petgraph 0.6 and 0.8 in the
# lock file.
rust-sugiyama = "0.4"

# Used by the vendored layout numerics in src/layout/algo/.
ndarray = "0.17"
num-traits = "0.2"
ordered-float = "5"

# Profile settings are in workspace root Cargo.toml
