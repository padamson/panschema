# cargo-deny configuration
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # Transitive unmaintained-crate warnings — not vulnerabilities. Cleared
    # when upstream consumers (wgpu/naga, proc-macro libs) migrate off them.
    "RUSTSEC-2024-0388", # derivative unmaintained (via wgpu/naga)
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained
    "RUSTSEC-2026-0215", # smallstr unmaintained (via sophia_jsonld → json-ld → json-syntax)

    # Accepted DoS risk, upstream-blocked (real advisories, not merely
    # unmaintained). quick-xml < 0.41 (memory-exhaustion via unbounded
    # namespace-declaration allocation in the XML reader) is pinned at
    # `^0.37` by oxrdfxml 0.2.3 -> sophia_xml 0.10 -> sophia; no released
    # sophia/oxrdfxml bumps it yet, so the fix is not reachable from our
    # lockfile. panschema reaches the vulnerable reader only via the
    # label-cache XML fallback (`labels.rs`), parsing semi-trusted upstream
    # ontology docs (Turtle is tried first; `--offline` skips fetching).
    # Remove both when oxrdfxml bumps quick-xml to >= 0.41.
    "RUSTSEC-2026-0194", # quick-xml NsReader memory-exhaustion DoS
    "RUSTSEC-2026-0195", # quick-xml namespace-declaration memory-exhaustion DoS
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "CECILL-B",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
