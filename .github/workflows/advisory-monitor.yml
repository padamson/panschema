name: Security Advisory Monitor

# Daily check for newly published RustSec advisories against the
# dependency tree, decoupled from push cadence. `cargo deny check
# advisories` reads deny.toml's `[advisories].ignore`, so already-triaged
# advisories stay quiet and only a *new* one trips the check. On a hit, a
# single tracking issue is opened (or updated); when the tree is clean
# again the issue is closed. It runs the same action as the gate in
# security.yml.
#
# Why a monitor when Security & Quality already runs `cargo deny` on push
# and weekly: advisories are published by the world, not by a commit. This
# surfaces a new one proactively — as an issue you can triage (bump the
# dep, or accept + ignore in deny.toml with rationale) — before it trips a
# push and reds `main`.

on:
  schedule:
    # Daily at 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch:

# Two overlapping runs would each open an issue.
concurrency:
  group: advisory-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  advisories:
    name: Check for new advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # open, update and close the tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny

      # Triage goes in comments: the action rewrites the issue body.
      - name: Check advisories and keep the tracking issue current
        uses: padamson/cargo-lockpatrol@40075b2231e33e8f0a6d08f39acd0691e1f3efba # v0.1.1
        with:
          issue: "true"
          issue-title: "Security: new dependency advisory detected"
          issue-label: security-advisory
