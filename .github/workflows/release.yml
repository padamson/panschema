name: Release

# A tag pattern added here also goes into the `release tags` ruleset and
# the `release` environment's deployment policies.
on:
  push:
    tags:
      - "v*.*.*"

# Read by default; the one job that writes a release asks for it itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Run full cross-platform test suite before building release artifacts
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  # The tag's version against each crate's latest release on crates.io: a
  # breaking change under a version that does not allow one fails here,
  # before anything is built or published. On 0.x a minor bump (0.4 to
  # 0.5) allows one.
  semver-checks:
    name: Semver Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # A tag whose version no publishable crate carries is a release whose
    # Cargo.toml bump was forgotten. Without this, the GitHub Release is
    # built and created before `cargo publish` refuses the old version.
    - name: Check the tag against the crate versions
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME#v}"
        if ! cargo metadata --no-deps --format-version 1 \
             | jq -e --arg v "$tag" '[.packages[] | select(.publish != []) | .version] | index($v) != null' > /dev/null; then
          echo "::error::no publishable crate is at version $tag; bump Cargo.toml"
          exit 1
        fi

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable

    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
      with:
        tool: cargo-semver-checks

    # html_writer.rs include_bytes! the viz bundle at compile time; empty
    # placeholders satisfy rustdoc without a wasm-pack run, and the bundle
    # is no part of the API being compared.
    - name: Stub WASM artifacts
      run: |
        mkdir -p panschema-viz/pkg
        touch panschema-viz/pkg/panschema_viz.js panschema-viz/pkg/panschema_viz_bg.wasm

    # Only crates with a library target have an API to compare;
    # cargo-semver-checks exits 1 on a binary-only or proc-macro crate, so
    # those are listed and passed over. A crate not yet on crates.io has no
    # baseline, so it is skipped too, but only on a 404; its first release
    # is published by hand anyway (see the publish job). Any other answer
    # (an outage, a rate limit) fails the job: skipping on it would release
    # with no semver check at all. The loop reads the crate list on stdin,
    # so the check (or a git fetch it starts) is kept off it, or it could
    # swallow the crates after the first.
    - name: Check semver compatibility
      env:
        USER_AGENT: ${{ github.repository }} release workflow (https://github.com/${{ github.repository }})
      run: |
        set -euo pipefail
        metadata=$(cargo metadata --no-deps --format-version 1)
        has_lib='any(.targets[]; any(.kind[]; . == "lib" or . == "rlib"))'
        jq -r ".packages[] | select(.publish != []) | select($has_lib | not) | .name" <<< "$metadata" \
          | while read -r crate; do echo "$crate has no library target; nothing to semver-check"; done
        jq -r ".packages[] | select(.publish != []) | select($has_lib) | .name" <<< "$metadata" > "$RUNNER_TEMP/crates"
        while read -r crate; do
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 \
                     -A "$USER_AGENT" "https://crates.io/api/v1/crates/$crate")
          case "$status" in
            200) cargo semver-checks check-release -p "$crate" </dev/null ;;
            404) echo "$crate is not on crates.io yet; nothing to compare against" ;;
            *)   echo "::error::crates.io answered $status for $crate"; exit 1 ;;
          esac
        done < "$RUNNER_TEMP/crates"

  build:
    name: Build ${{ matrix.target }}
    needs: [test, semver-checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # A glibc binary runs only where glibc is at least as new as the
          # build machine's, so this one is pinned rather than following
          # ubuntu-latest forward; scripts/check-linux-binary.sh holds the
          # floor that pin implies. The musl build links statically and runs
          # on any Linux, whatever the runner.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable
        targets: ${{ matrix.target }}, wasm32-unknown-unknown

    # Release binaries embed the real WebGPU viz bundle (build.rs refuses
    # to build without wasm-pack when the bundle is absent — no stubs in a
    # shipped binary), so the bundle is built before the release build.
    - name: Install wasm-pack
      uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
      with:
        tool: wasm-pack

    - name: Build WASM package
      run: wasm-pack build panschema-viz --target web

    - name: Name the runner image
      id: image
      uses: ./.github/actions/runner-image

    - name: Cache Cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ steps.image.outputs.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ steps.image.outputs.os }}-${{ matrix.target }}-cargo-release-

    # `ring` and the musl build's allocator compile C for the target, and
    # Ubuntu has no musl C compiler until this installs one.
    - name: Install musl tools
      if: endsWith(matrix.target, '-musl')
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Build Release
      run: cargo build -p panschema --release --target ${{ matrix.target }}

    - name: Strip binary (Linux/macOS)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        for bin in panschema mdbook-panschema; do
          if [ -f "target/${{ matrix.target }}/release/$bin" ]; then
            strip "target/${{ matrix.target }}/release/$bin"
          fi
        done

    - name: Check how the binaries link (Linux)
      if: runner.os == 'Linux'
      run: |
        scripts/check-linux-binary.sh ${{ matrix.target }} \
          target/${{ matrix.target }}/release/panschema \
          target/${{ matrix.target }}/release/mdbook-panschema

    - name: Smoke-test panschema (Linux)
      if: runner.os == 'Linux'
      run: scripts/smoke-test-binary.sh target/${{ matrix.target }}/release/panschema

    - name: Create archive (Unix)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ../../../panschema-${{ github.ref_name }}-${{ matrix.target }}.tar.gz panschema mdbook-panschema

    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        7z a ../../../panschema-${{ github.ref_name }}-${{ matrix.target }}.zip panschema.exe mdbook-panschema.exe

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: panschema-${{ matrix.target }}
        path: panschema-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
        if-no-files-found: error

  release:
    name: Create Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install parse-changelog
      uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
      with:
        tool: parse-changelog

    - name: Get version
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Generate Release Notes
      run: parse-changelog CHANGELOG.md ${{ steps.get_version.outputs.version }} > release_notes.md

    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        path: artifacts
        merge-multiple: true

    - name: List artifacts
      run: ls -la artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
      with:
        files: artifacts/*
        body_path: release_notes.md
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only release tags can deploy here, and the crates.io publisher names
    # this environment, so a copy of this file run from a branch can't publish.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack
      uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
      with:
        tool: wasm-pack

    # The published package must be self-contained: build the viz bundle
    # and stage it at the in-crate path build.rs prefers, so `cargo
    # publish`'s verification build (and every downstream `cargo install`)
    # needs neither the workspace nor wasm-pack.
    - name: Build and stage viz bundle
      run: |
        wasm-pack build panschema-viz --target web
        mkdir -p panschema/viz-bundle
        cp panschema-viz/pkg/panschema_viz.js panschema-viz/pkg/panschema_viz_bg.wasm panschema/viz-bundle/

    # Trusted publishing: a short-lived OIDC-exchanged token scoped to this
    # repo, workflow and environment, no long-lived secret. No
    # skip-if-missing guard — failing at auth is correct; a skipped publish
    # that reports success is the trap.
    #
    # Trusted publishing cannot mint a crate's *first* release, so a newly
    # added workspace member is published once by hand with a token before
    # its first tag, then given a trusted publisher naming this workflow and
    # the `release` environment; every release after that runs from here.
    - name: Authenticate with crates.io
      id: auth
      uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

    # Published one at a time, in dependency order, skipping any version
    # already on the index. `--workspace` would order them for us, but it
    # aborts on a member that is already published, so a release that got
    # partway — the first crate up, the second refused — could not be
    # finished by re-running this job. Skipping makes the job idempotent.
    # A version is skipped only on a 200; a 404 publishes and any other
    # answer fails the job. cargo waits for each publish to reach the index
    # before the next.
    - name: Publish to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        USER_AGENT: ${{ github.repository }} release workflow (https://github.com/${{ github.repository }})
      run: |
        set -euo pipefail
        version="${GITHUB_REF#refs/tags/v}"
        ordered=(panschema-model panschema)

        # A member added later publishes in whatever order cargo picks
        # unless it is listed above, so make the omission loud here
        # rather than a dependency-order failure at upload.
        for crate in $(cargo metadata --no-deps --format-version 1 \
                       | jq -r '.packages[] | select(.publish != []) | .name'); do
          if ! printf '%s\n' "${ordered[@]}" | grep -qx "$crate"; then
            echo "::error::workspace member $crate is publishable but missing from the ordered list in this step"
            exit 1
          fi
        done

        for crate in "${ordered[@]}"; do
          status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 \
                     -A "$USER_AGENT" "https://crates.io/api/v1/crates/$crate/$version")
          case "$status" in
            200) echo "$crate $version is already on crates.io; skipping it" ;;
            404) cargo publish -p "$crate" --allow-dirty ;;
            *)   echo "::error::crates.io answered $status for $crate $version"; exit 1 ;;
          esac
        done
