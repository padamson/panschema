name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Run full cross-platform test suite before building release artifacts
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: ${{ matrix.target }}, wasm32-unknown-unknown

    # Release binaries embed the real WebGPU viz bundle (build.rs refuses
    # to build without wasm-pack when the bundle is absent — no stubs in a
    # shipped binary), so the bundle is built before the release build.
    - name: Install wasm-pack
      uses: taiki-e/install-action@wasm-pack

    - name: Build WASM package
      run: wasm-pack build panschema-viz --target web

    - name: Cache Cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.target }}-cargo-release-

    - name: Build Release
      run: cargo build -p panschema --release --target ${{ matrix.target }}

    - name: Strip binary (Linux/macOS)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        for bin in panschema mdbook-panschema; do
          if [ -f "target/${{ matrix.target }}/release/$bin" ]; then
            strip "target/${{ matrix.target }}/release/$bin"
          fi
        done

    - name: Create archive (Unix)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ../../../panschema-${{ github.ref_name }}-${{ matrix.target }}.tar.gz panschema mdbook-panschema

    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        7z a ../../../panschema-${{ github.ref_name }}-${{ matrix.target }}.zip panschema.exe mdbook-panschema.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: panschema-${{ matrix.target }}
        path: panschema-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
        if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install parse-changelog
      uses: taiki-e/install-action@v2.85.6
      with:
        tool: parse-changelog

    - name: Get version
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Generate Release Notes
      run: parse-changelog CHANGELOG.md ${{ steps.get_version.outputs.version }} > release_notes.md

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: List artifacts
      run: ls -la artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: artifacts/*
        body_path: release_notes.md
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack
      uses: taiki-e/install-action@wasm-pack

    # The published package must be self-contained: build the viz bundle
    # and stage it at the in-crate path build.rs prefers, so `cargo
    # publish`'s verification build (and every downstream `cargo install`)
    # needs neither the workspace nor wasm-pack.
    - name: Build and stage viz bundle
      run: |
        wasm-pack build panschema-viz --target web
        mkdir -p panschema/viz-bundle
        cp panschema-viz/pkg/panschema_viz.js panschema-viz/pkg/panschema_viz_bg.wasm panschema/viz-bundle/

    # Trusted publishing: a short-lived OIDC-exchanged token, no
    # long-lived secret. No skip-if-missing guard — failing at auth is
    # correct; a skipped publish that reports success is the trap.
    - name: Authenticate with crates.io
      id: auth
      uses: rust-lang/crates-io-auth-action@v1

    - name: Publish to crates.io
      run: cargo publish -p panschema --allow-dirty
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
