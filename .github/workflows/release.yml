name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Read by default; the one job that writes a release asks for it itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Run full cross-platform test suite before building release artifacts
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: stable
        targets: ${{ matrix.target }}, wasm32-unknown-unknown

    # Release binaries embed the real WebGPU viz bundle (build.rs refuses
    # to build without wasm-pack when the bundle is absent — no stubs in a
    # shipped binary), so the bundle is built before the release build.
    - name: Install wasm-pack
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: wasm-pack

    - name: Build WASM package
      run: wasm-pack build panschema-viz --target web

    - name: Cache Cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.target }}-cargo-release-

    - name: Build Release
      run: cargo build -p panschema --release --target ${{ matrix.target }}

    - name: Strip binary (Linux/macOS)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        for bin in panschema mdbook-panschema; do
          if [ -f "target/${{ matrix.target }}/release/$bin" ]; then
            strip "target/${{ matrix.target }}/release/$bin"
          fi
        done

    - name: Create archive (Unix)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ../../../panschema-${{ github.ref_name }}-${{ matrix.target }}.tar.gz panschema mdbook-panschema

    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        7z a ../../../panschema-${{ github.ref_name }}-${{ matrix.target }}.zip panschema.exe mdbook-panschema.exe

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: panschema-${{ matrix.target }}
        path: panschema-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
        if-no-files-found: error

  release:
    name: Create Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install parse-changelog
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: parse-changelog

    - name: Get version
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Generate Release Notes
      run: parse-changelog CHANGELOG.md ${{ steps.get_version.outputs.version }} > release_notes.md

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: artifacts
        merge-multiple: true

    - name: List artifacts
      run: ls -la artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        files: artifacts/*
        body_path: release_notes.md
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: wasm-pack

    # The published package must be self-contained: build the viz bundle
    # and stage it at the in-crate path build.rs prefers, so `cargo
    # publish`'s verification build (and every downstream `cargo install`)
    # needs neither the workspace nor wasm-pack.
    - name: Build and stage viz bundle
      run: |
        wasm-pack build panschema-viz --target web
        mkdir -p panschema/viz-bundle
        cp panschema-viz/pkg/panschema_viz.js panschema-viz/pkg/panschema_viz_bg.wasm panschema/viz-bundle/

    # Trusted publishing: a short-lived OIDC-exchanged token, no
    # long-lived secret. No skip-if-missing guard — failing at auth is
    # correct; a skipped publish that reports success is the trap.
    #
    # Trusted publishing cannot mint a crate's *first* release, so a newly
    # added workspace member is published once by hand with a token before
    # its first tag; every release after that runs from here.
    - name: Authenticate with crates.io
      id: auth
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

    # `--workspace` publishes the members in dependency order, so
    # `panschema-model` lands before the `panschema` that requires it, and
    # `panschema-viz` (publish = false) is skipped.
    - name: Publish to crates.io
      run: cargo publish --workspace --allow-dirty
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
