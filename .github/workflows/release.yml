name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Read by default; the one job that writes a release asks for it itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Run full cross-platform test suite before building release artifacts
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  # The tag's version against each crate's latest release on crates.io: a
  # breaking change under a version that does not allow one fails here,
  # before anything is built or published. On 0.x a minor bump (0.4 to
  # 0.5) allows one. A crate not yet on crates.io has no baseline, so it
  # is skipped by name; its first release is published by hand anyway (see
  # the publish job), and the check starts with its second.
  semver-checks:
    name: Semver Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: stable

    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
      with:
        tool: cargo-semver-checks

    # html_writer.rs include_bytes! the viz bundle at compile time; empty
    # placeholders satisfy rustdoc without a wasm-pack run, and the bundle
    # is no part of the API being compared.
    - name: Stub WASM artifacts
      run: |
        mkdir -p panschema-viz/pkg
        touch panschema-viz/pkg/panschema_viz.js panschema-viz/pkg/panschema_viz_bg.wasm

    - name: Check semver compatibility
      run: |
        set -euo pipefail
        for crate in $(cargo metadata --no-deps --format-version 1 \
                       | jq -r '.packages[] | select(.publish != []) | .name'); do
          if curl -sfo /dev/null \
               -A "panschema release workflow (github.com/padamson/panschema)" \
               "https://crates.io/api/v1/crates/$crate"; then
            cargo semver-checks check-release -p "$crate"
          else
            echo "$crate is not on crates.io yet; nothing to compare against"
          fi
        done

  build:
    name: Build ${{ matrix.target }}
    needs: [test, semver-checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: stable
        targets: ${{ matrix.target }}, wasm32-unknown-unknown

    # Release binaries embed the real WebGPU viz bundle (build.rs refuses
    # to build without wasm-pack when the bundle is absent — no stubs in a
    # shipped binary), so the bundle is built before the release build.
    - name: Install wasm-pack
      uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
      with:
        tool: wasm-pack

    - name: Build WASM package
      run: wasm-pack build panschema-viz --target web

    - name: Name the runner image
      id: image
      uses: ./.github/actions/runner-image

    - name: Cache Cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ steps.image.outputs.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ steps.image.outputs.os }}-${{ matrix.target }}-cargo-release-

    - name: Build Release
      run: cargo build -p panschema --release --target ${{ matrix.target }}

    - name: Strip binary (Linux/macOS)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        for bin in panschema mdbook-panschema; do
          if [ -f "target/${{ matrix.target }}/release/$bin" ]; then
            strip "target/${{ matrix.target }}/release/$bin"
          fi
        done

    - name: Create archive (Unix)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ../../../panschema-${{ github.ref_name }}-${{ matrix.target }}.tar.gz panschema mdbook-panschema

    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        cd target/${{ matrix.target }}/release
        7z a ../../../panschema-${{ github.ref_name }}-${{ matrix.target }}.zip panschema.exe mdbook-panschema.exe

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: panschema-${{ matrix.target }}
        path: panschema-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
        if-no-files-found: error

  release:
    name: Create Release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install parse-changelog
      uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
      with:
        tool: parse-changelog

    - name: Get version
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Generate Release Notes
      run: parse-changelog CHANGELOG.md ${{ steps.get_version.outputs.version }} > release_notes.md

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: artifacts
        merge-multiple: true

    - name: List artifacts
      run: ls -la artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        files: artifacts/*
        body_path: release_notes.md
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack
      uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
      with:
        tool: wasm-pack

    # The published package must be self-contained: build the viz bundle
    # and stage it at the in-crate path build.rs prefers, so `cargo
    # publish`'s verification build (and every downstream `cargo install`)
    # needs neither the workspace nor wasm-pack.
    - name: Build and stage viz bundle
      run: |
        wasm-pack build panschema-viz --target web
        mkdir -p panschema/viz-bundle
        cp panschema-viz/pkg/panschema_viz.js panschema-viz/pkg/panschema_viz_bg.wasm panschema/viz-bundle/

    # Trusted publishing: a short-lived OIDC-exchanged token, no
    # long-lived secret. No skip-if-missing guard — failing at auth is
    # correct; a skipped publish that reports success is the trap.
    #
    # Trusted publishing cannot mint a crate's *first* release, so a newly
    # added workspace member is published once by hand with a token before
    # its first tag; every release after that runs from here.
    - name: Authenticate with crates.io
      id: auth
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

    # Published one at a time, in dependency order, skipping any version
    # already on the index. `--workspace` would order them for us, but it
    # aborts on a member that is already published, so a release that got
    # partway — the first crate up, the second refused — could not be
    # finished by re-running this job. Skipping makes the job idempotent.
    # cargo waits for each publish to reach the index before the next.
    - name: Publish to crates.io
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      run: |
        set -euo pipefail
        version="${GITHUB_REF#refs/tags/v}"
        ordered=(panschema-model panschema)

        # A member added later publishes in whatever order cargo picks
        # unless it is listed above, so make the omission loud here
        # rather than a dependency-order failure at upload.
        for crate in $(cargo metadata --no-deps --format-version 1 \
                       | jq -r '.packages[] | select(.publish != []) | .name'); do
          if ! printf '%s\n' "${ordered[@]}" | grep -qx "$crate"; then
            echo "::error::workspace member $crate is publishable but missing from the ordered list in this step"
            exit 1
          fi
        done

        for crate in "${ordered[@]}"; do
          if curl -sfo /dev/null \
               -A "panschema release workflow (github.com/padamson/panschema)" \
               "https://crates.io/api/v1/crates/$crate/$version"; then
            echo "$crate $version is already on crates.io; skipping"
            continue
          fi
          cargo publish -p "$crate" --allow-dirty
        done
