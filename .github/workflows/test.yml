name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  skill-version:
    name: Skill version guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The pre-commit hook of the same name is per-clone and opt-in, so a
    # hookless clone or a `--no-verify` commit would ship a skill edit
    # without the version bump installed consumers key their updates on.
    # Same script, run against the PR base or the tip before the push.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute diff base
        id: base
        uses: ./.github/actions/diff-base

      # The script treats an unusable ref as an error; skipping when there
      # is nothing to compare against is this job's call, not the script's.
      - name: Check the skill version against the base
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Base $BASE is not reachable (force push or rewritten history); nothing to compare."
            exit 0
          fi
          scripts/check-skill-version-bumped.sh --base "$BASE"

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      # html_writer.rs include_bytes! these at compile time; empty
      # placeholders satisfy type-checking without a wasm-pack run.
      - name: Stub WASM artifacts
        run: |
          mkdir -p panschema-viz/pkg
          touch panschema-viz/pkg/panschema_viz.js panschema-viz/pkg/panschema_viz_bg.wasm

      - name: Check compilation on MSRV
        run: cargo check -p panschema -p panschema-model

  lint:
    name: Lint and Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Clippy and the doctests compile playwright-rs as a dev-dependency but
    # never launch a browser, so its build script's driver download is
    # skipped: no network dependency, and nothing to cache for it.
    env:
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Stub WASM artifacts
        run: |
          mkdir -p panschema-viz/pkg
          touch panschema-viz/pkg/panschema_viz.js panschema-viz/pkg/panschema_viz_bg.wasm

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The fuzz crate is workspace-excluded (nightly-only to *run*), so
      # nothing else ever compiles it — without this canary its targets
      # bit-rot silently against panschema's API and the breakage surfaces
      # only when someone finally dispatches the on-demand fuzz workflow.
      # A plain stable type-check is enough to catch that class.
      - name: Fuzz-crate compile canary
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: Clippy (release)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (with dev feature)
        run: cargo clippy --workspace --all-targets --features panschema/dev -- -D warnings

      # Cheap canary; the full wasm-pack build runs in the test job.
      - name: Check panschema-viz on wasm32-unknown-unknown
        run: cargo check --target wasm32-unknown-unknown -p panschema-viz

      # CI owns doctests entirely — the commit gate deliberately skips
      # them. Workspace-wide with the dev feature, matching the coverage
      # the gate's doctest hook had before it moved here.
      - name: Run doc-tests
        run: cargo test --doc --workspace --features panschema/dev

      - name: Generate documentation
        run: cargo doc --no-deps -p panschema -p panschema-model

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    # Read by playwright-rs's build script, so it must hold for every cargo
    # invocation in the job — the browser installer and the test runs build
    # the same driver once, into the directory cached below.
    env:
      PLAYWRIGHT_DRIVER_CACHE_DIR: ${{ github.workspace }}/drivers

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack
      uses: taiki-e/install-action@wasm-pack

    - name: Cache Cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache WASM build
      uses: actions/cache@v6
      id: wasm-cache
      with:
        path: panschema-viz/pkg/
        key: wasm-${{ runner.os }}-${{ hashFiles('panschema-viz/src/**', 'panschema-viz/Cargo.toml') }}

    - name: Build WASM package
      if: steps.wasm-cache.outputs.cache-hit != 'true'
      run: wasm-pack build panschema-viz --target web

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    # No Node.js step and no Playwright version: the example asks the crate
    # for the build its driver expects (its doc comment says why nothing in
    # this repo names one). Keyed on the lockfile so a `playwright-rs` bump
    # misses the cache; `restore-keys` still seeds it from the previous run,
    # leaving the installer only the new build to fetch.
    #
    # The driver itself is assembled by playwright-rs's build script from
    # two downloads. Relocated out of `target/` into `drivers/` — the
    # crate's own knob for CI — so it lives on this key beside the browsers
    # it must match, rather than riding the cargo cache by accident.
    - name: Cache Playwright browsers and driver
      uses: actions/cache@v6
      with:
        path: |
          drivers/
          ~/.cache/ms-playwright
          ~/.cache/playwright-rust
          ~/Library/Caches/ms-playwright
          ~/Library/Caches/playwright-rust
          ~/AppData/Local/ms-playwright
          ~/AppData/Local/playwright-rust
        key: playwright-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright browsers
      if: runner.os != 'Linux'
      run: cargo run --example install-browsers

    # Linux browsers also need system libraries a plain install leaves out.
    - name: Install Playwright browsers and system dependencies
      if: runner.os == 'Linux'
      run: cargo run --example install-browsers -- --with-deps

    - name: Run tests (release)
      run: cargo nextest run --workspace
      env:
        BROWSER: all

    - name: Run tests (with dev feature)
      run: cargo nextest run --workspace --features panschema/dev -E 'package(panschema)'
      env:
        BROWSER: all

  postgres-apply:
    name: Postgres Apply (real database)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Docker-gated real-Postgres apply test for PostgresWriter output
    # (`#[ignore]`d elsewhere: local runs skip container startup cost).
    # ubuntu-latest ships a running Docker daemon, so this is its own
    # small job rather than folded into the OS test matrix above, which
    # also runs on macOS/Windows runners without one.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-postgres-apply-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-postgres-apply-

      # html_writer.rs include_bytes!/include_str! these at compile time;
      # empty placeholders satisfy type-checking without a wasm-pack run.
      - name: Stub WASM artifacts
        run: |
          mkdir -p panschema-viz/pkg
          touch panschema-viz/pkg/panschema_viz.js panschema-viz/pkg/panschema_viz_bg.wasm

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run Postgres apply test against a real database
        run: cargo nextest run -p panschema --features dev --run-ignored=only -E 'test(postgres_apply)'
