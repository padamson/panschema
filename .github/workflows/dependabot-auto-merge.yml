name: Dependabot auto-merge

# Dependabot opens PRs but never merges them. This enables auto-merge on
# every Dependabot PR so it merges once the required status checks pass.
# Applies to all update types (major, minor, patch); the status checks are
# the gate, so a bump that breaks the build simply won't merge.
#
# The gate is only as wide as main's ruleset. That ruleset currently
# requires the three Test jobs and NOT Supply Chain Review, so a bump that
# brings in unvetted crates merges with cargo-vet red — add the job to the
# ruleset's required checks to close that, not a step here.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    # Only Dependabot's own PRs — never anyone else's.
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
