version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    ignore:
      # The HTML5 conformance test parses through markup5ever_rcdom, whose
      # latest release still pairs with html5ever 0.39; a newer html5ever
      # brings a TreeSink trait rcdom does not implement, so the bump
      # cannot compile until rcdom catches up. Drop this entry when it does.
      - dependency-name: "html5ever"
        update-types: ["version-update:semver-major"]
    # Wait before proposing a bump. cargo-vet's import sets (Mozilla,
    # Google, ISRG, ...) have not audited a version that is hours old, so
    # day-zero bumps are structurally guaranteed to fail Supply Chain
    # Review — and the only available response is an exemption nobody
    # audited. A week of lag lets the upstream audits land first. Also
    # skips releases that get yanked and lets advisories surface before
    # adoption.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # Grouping exists to keep the weekly run to as few PRs as possible.
    # Every cargo PR edits Cargo.lock, so two open cargo PRs conflict the
    # moment one merges — the second must rebase and re-run CI, and with N
    # PRs the auto-merge cascade costs O(N²) runs. No merge machinery
    # avoids a lockfile conflict; fewer PRs is the fix.
    groups:
      # Listed first: a dependency joins the first group it matches, so
      # this claims playwright-rs for every update type before the filtered
      # groups below can. It is the one bump that also moves the browser
      # driver and the browsers, so it is the one most likely to need work
      # in the e2e suite; on its own it can wait without holding up the
      # week's other minor bumps. That costs one extra PR only on the weeks
      # it moves.
      playwright-dependencies:
        patterns:
          - "playwright-rs"
      start-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Only `default-days` here: Dependabot's schema rejects the per-semver
    # keys for github-actions, and one bad entry invalidates this whole file.
    cooldown:
      default-days: 7
    # One PR for the week's action bumps, same cascade rationale as cargo.
    groups:
      actions:
        patterns:
          - "*"
