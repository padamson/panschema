[package]
name = "panschema-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The LinkML schema model panschema reads and writes, with its inheritance resolution and YAML reader"
keywords = ["linkml", "schema", "data-model"]
categories = ["data-structures", "parser-implementations"]
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
thiserror = "2"
semver = "1"
mutants = "0.0.4"
# A slot's `pattern`, checked against string values. Default features
# (Unicode-aware `\w`/`\d`) so a pattern validates with standard regex
# semantics.
regex = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
